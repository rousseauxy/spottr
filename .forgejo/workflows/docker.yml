name: Build and publish Docker image

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # The image lives under the GitHub account, not under the forge organisation the repository sits in
  # (github.repository is apps/spottr here, and ghcr.io has no owner "apps").
  IMAGE_NAME: rousseauxy/spottr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    enable-openid-connect: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Forgejo DOES provide secrets.GITHUB_TOKEN, but it authenticates to Forgejo - not GitHub -
      # so it cannot log in to ghcr.io. The registry token is a classic PAT with write:packages,
      # kept in SecretHive (ci-forge/ghcr-push-token) and read with this job's own forge token; see
      # tools/ci/ghcr-login.sh. The forge secret is passed only as a fallback for the move.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_FALLBACK: ${{ secrets.GHCR_TOKEN }}
        run: sh tools/ci/ghcr-login.sh

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version the binary reports (/_/config, Newznab caps, the startup log): v0.7.1 -> 0.7.1.
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # No build cache: the forge's GitHub-style cache server answers 404, which failed the job after
          # the image had been pushed (v0.3.1). The build takes about a minute and a half without it.

